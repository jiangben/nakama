<div class="bg-grad d-flex h-100">
  <div class="align-self-center mx-auto">
    <h1 class="text-center mb-4">
      <img src="/static/svg/logo.svg" alt="Nakama Logo" width="175">
    </h1>
    <div class="alert alert-warning" role="alert" *ngIf="error">
      {{error}}
    </div>
    <div class="card">
      <div class="card-body">
        <h3 class="text-center">{{'Login' | translate}}</h3>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" [ngClass]="{'was-validated': submitted}">
          <div class="form-group form-row">
            <div class="col-sm-12">
              <label for="username">{{'Username' | translate}}</label>
              <input type="text" id="username" class="form-control" formControlName="username" required autofocus
                     [ngClass]="{'is-invalid': f.username.dirty && f.username.errors}" />
              <div class="invalid-tooltip" [hidden]="f.username.disabled || f.username.valid || f.username.pristine">
                {{'Please enter a username' | translate}}
              </div>
            </div>
          </div>
          <div class="form-group form-row">
            <div class="col-sm-12">
              <label for="password">{{'Password' | translate}}</label>
              <input type="password" id="password" class="form-control" formControlName="password" required
                     [ngClass]="{'is-invalid': f.password.dirty && f.password.errors}" />
              <div class="invalid-tooltip" [hidden]="f.password.disabled || f.password.valid || f.password.pristine">
                {{'Password must be at least 8 characters' | translate}}
              </div>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" [disabled]="!loginForm.valid || submitted">
            {{'Login' | translate}}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
